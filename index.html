<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Water Battle</title>
<style>
:root{--bg:#f3f8fb;--card:#fff;--text:#14313f;--muted:#5d7886;--accent:#1d8fd1;--accent2:#14b8a6;--line:#d8e6ee;--win:#f59e0b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1a22;--card:#16262f;--text:#e6f2f8;--muted:#8fa9b7;--accent:#4fb3f0;--accent2:#2dd4bf;--line:#26404d;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;max-width:760px;margin-inline:auto}
h1{font-size:1.5rem;margin:8px 0 4px;text-align:center}
.banner{text-align:center;font-weight:600;padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin:12px 0 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.card.lead{border-color:var(--win);box-shadow:0 0 0 2px var(--win)}
.name{width:100%;text-align:center;font-size:1.1rem;font-weight:700;background:transparent;border:0;border-bottom:1px dashed var(--line);color:var(--text);padding:4px}
.big{font-size:2.6rem;font-weight:800;margin:10px 0 0;color:var(--accent)}
.unit{color:var(--muted);font-size:.85rem}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.btns{display:grid;gap:8px;margin-top:12px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:14px 8px;background:var(--accent);color:#fff;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
button.alt{background:var(--accent2)}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:600;padding:9px}
.row{display:flex;gap:6px}
.row input{flex:1;min-width:0;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:10px;font:inherit;text-align:center}
.row button{padding:10px 14px}
.goal{display:flex;justify-content:center;align-items:center;gap:8px;margin:16px 0 4px;color:var(--muted);font-size:.9rem}
.goal input{width:90px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px;text-align:center;font:inherit}
.hist{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;overflow-x:auto}
.hist table{width:100%;border-collapse:collapse;font-size:.9rem}
.hist th,.hist td{padding:6px;text-align:center;border-bottom:1px solid var(--line)}
.hist th{color:var(--muted);font-weight:600}
#msg{text-align:center;color:var(--muted);font-size:.85rem;margin-top:12px}
</style>
</head>
<body>
<h1>💧 Water Battle</h1>
<div class="banner" id="banner">Loading…</div>
<div class="grid" id="cards"></div>
<div class="goal">Daily goal <input id="goal" type="number" inputmode="numeric" value="2000" min="0" step="100"> ml</div>
<div class="hist"><table><thead><tr><th>Day</th><th id="h0">P1</th><th id="h1">P2</th><th>Winner</th></tr></thead><tbody id="hist"></tbody></table></div>
<div id="msg"></div>

<script type="module">
let initializeApp, getFirestore, collection, doc, addDoc, deleteDoc, setDoc, onSnapshot, query, where;
const FB = "https://www.gstatic.com/firebasejs/10.12.2/";

/* ============ PASTE YOUR FIREBASE CONFIG HERE ============ */
const firebaseConfig = {
  apiKey: "AIzaSyBmkIKXxTNgHzU96yplQ1V_xhZP8_IlPoU",
  authDomain: "water-tracker-42594.firebaseapp.com",
  projectId: "water-tracker-42594",
  storageBucket: "water-tracker-42594.firebasestorage.app",
  messagingSenderId: "184238176752",
  appId: "1:184238176752:web:30a2b1c228ac7e819cc535"
  measurementId: "G-06MCGPFMRQ"
};
/* ========================================================= */

const DAY = 86400000;
let logs = [], names = ["Player 1", "Player 2"], goal = 2000, db = null;
const el = id => document.getElementById(id);
const startOfDay = t => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const esc = s => { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; };
const err = e => { el("msg").textContent = "Couldn't save: " + ((e && e.message) || "unknown error"); };

function totals() {
  const s = startOfDay(Date.now()), today = [0, 0], byDay = {};
  logs.forEach(l => {
    if (l.t >= s) today[l.p] += l.ml;
    const k = startOfDay(l.t);
    byDay[k] = byDay[k] || [0, 0];
    byDay[k][l.p] += l.ml;
  });
  return { today, byDay };
}

function render() {
  const T = totals(), t = T.today;
  const lead = t[0] > t[1] ? 0 : t[1] > t[0] ? 1 : -1;
  el("banner").textContent = lead < 0
    ? (t[0] === 0 ? "Who will drink first? 🏁" : "Dead heat! 🤝")
    : "🏆 " + names[lead] + " leads by " + Math.abs(t[0] - t[1]) + " ml today";

  const c = el("cards");
  if (!c.children.length) {
    for (let p = 0; p < 2; p++) {
      const d = document.createElement("div");
      d.className = "card"; d.id = "card" + p;
      d.innerHTML =
        '<input class="name" id="name' + p + '" maxlength="20" aria-label="Name">' +
        '<div class="big" id="tot' + p + '">0</div><div class="unit">ml today</div>' +
        '<div class="bar"><i id="bar' + p + '"></i></div><div class="unit" id="pct' + p + '"></div>' +
        '<div class="btns">' +
        '<button data-p="' + p + '" data-ml="250">+250 ml</button>' +
        '<button class="alt" data-p="' + p + '" data-ml="500">+500 ml</button>' +
        '<div class="row"><input id="cust' + p + '" type="number" inputmode="numeric" placeholder="custom ml">' +
        '<button class="alt" data-p="' + p + '" data-custom="1">Add</button></div>' +
        '<button class="ghost" data-p="' + p + '" data-undo="1">Undo last</button></div>';
      c.appendChild(d);
      el("name" + p).addEventListener("change", e => saveNames(p, e.target.value));
    }
    c.addEventListener("click", onClick);
  }
  for (let q = 0; q < 2; q++) {
    const nm = el("name" + q);
    if (document.activeElement !== nm) nm.value = names[q];
    el("tot" + q).textContent = t[q];
    const pc = goal > 0 ? Math.min(100, Math.round(t[q] / goal * 100)) : 0;
    el("bar" + q).style.width = pc + "%";
    el("pct" + q).textContent = goal > 0 ? (pc >= 100 ? "Goal reached! 🎉" : pc + "% of goal") : "";
    el("card" + q).className = "card" + (lead === q ? " lead" : "");
    el("h" + q).textContent = names[q];
  }
  if (document.activeElement !== el("goal")) el("goal").value = goal;

  let rows = "";
  const s = startOfDay(Date.now());
  for (let i = 0; i < 7; i++) {
    const k = s - i * DAY, v = T.byDay[k] || [0, 0];
    const w = v[0] > v[1] ? names[0] : v[1] > v[0] ? names[1] : (v[0] ? "Tie" : "–");
    const lab = i === 0 ? "Today" : new Date(k).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
    rows += "<tr><td>" + lab + "</td><td>" + v[0] + "</td><td>" + v[1] + "</td><td>" + esc(w) + "</td></tr>";
  }
  el("hist").innerHTML = rows;
}

function onClick(e) {
  const b = e.target.closest("button");
  if (!b || !db) return;
  const p = +b.dataset.p;
  if (b.dataset.undo) {
    const mine = logs.filter(l => l.p === p).sort((a, b) => b.t - a.t)[0];
    if (mine) deleteDoc(doc(db, "log", mine.id)).catch(err);
    return;
  }
  const ml = b.dataset.custom ? parseInt(el("cust" + p).value, 10) : parseInt(b.dataset.ml, 10);
  if (!ml || ml <= 0 || ml > 5000) return;
  if (b.dataset.custom) el("cust" + p).value = "";
  addDoc(collection(db, "log"), { p, ml, t: Date.now() }).catch(err);
  if (navigator.vibrate) navigator.vibrate(20);
}

function saveNames(p, val) {
  if (!db) return;
  const n = names.slice();
  n[p] = (val || "").trim() || ("Player " + (p + 1));
  setDoc(doc(db, "settings", "main"), { names: n, goal }).catch(err);
}

el("goal").addEventListener("change", e => {
  const g = parseInt(e.target.value, 10);
  if (isNaN(g) || g < 0 || !db) return;
  setDoc(doc(db, "settings", "main"), { names, goal: g }).catch(err);
});

render();

window.addEventListener("error", e => { el("msg").textContent = "Error: " + e.message; });

if (firebaseConfig.apiKey === "PASTE_ME") {
  el("banner").textContent = "Paste your Firebase config into index.html to get started.";
} else {
  try {
    const [appMod, fsMod] = await Promise.all([import(FB + "firebase-app.js"), import(FB + "firebase-firestore.js")]);
    ({ initializeApp } = appMod);
    ({ getFirestore, collection, doc, addDoc, deleteDoc, setDoc, onSnapshot, query, where } = fsMod);
    db = getFirestore(initializeApp(firebaseConfig));
    onSnapshot(doc(db, "settings", "main"), s => {
      if (s.exists()) {
        const v = s.data();
        names = v.names || names;
        goal = typeof v.goal === "number" ? v.goal : goal;
      }
      render();
    }, err);
    onSnapshot(query(collection(db, "log"), where("t", ">=", startOfDay(Date.now()) - 7 * DAY)), q => {
      logs = q.docs.map(x => ({ id: x.id, ...x.data() }));
      render();
    }, err);
  } catch (e) {
    el("banner").textContent = "Couldn't load Firebase. Check your connection or ad blocker.";
    el("msg").textContent = String((e && e.message) || e);
  }
}
</script>
</body>
</html>
